excluded:

analyzer_rules: # Rules run by `swiftlint analyze`
  - unused_declaration
  - unused_import

custom_rules:
  space_after_opening_brace:
    included: ".*\\.swift"
    name: "Brace Space"
    message: "Opening brace should be followed by a space or a newline"
    regex: "\\{[^ \n\r\\}]"
    match_kinds:
      - argument
      - identifier
      - keyword
      - parameter
    severity: warning

  empty_first_line:
    name: "Empty First Line"
    message: "There should be an empty line after a declaration"
    regex: "(^[ a-zA-Z ]*(?:class) (?!(?:var|let))[ a-zA-Z:]*\\{\n *\\S+)"

  auto_generated_leftovers:
    name: "Empty Methods"
    message: "Delete auto-generated functions that you don't use"
    regex: 'func [^\n]*\{\n(\s*super\.[^\n]*\n(\s*\/\/[^\n]*\n)*|(\s*\/\/[^\n]*\n)+)\s*\}'

  objc_same_line:
    name: "@objc Placement"
    message: "@objc needs to be on the same line if used without params"
    regex: '@objc\n'

  os_log_import_unify:
    name: "Unify OSLog import"
    message: "os.log is deprecated, use OSLog instead"
    regex: "import os.log"

  erase_to_any_publisher_last:
    name: "EraseToAnyPublisher Should Be Last"
    regex: '\.eraseToAnyPublisher\(\)(\.|\n\s+\.)'
    message: "The call to .eraseToAnyPublisher() should be the last in the chain."

# Additional rules without enforcing
#
# Always use `self.` to prefix access to instance variables
# Optionally use `self.` to prefix method calls. Default to not prefixing unless really needed.
#
# All class type declarations should have an empty line after and before `{` and `}` respectively.
# For enums and structs this is optional, the larger the more likely to have empty lines padding.
#

# Rule configuration
colon:
  apply_to_dictionaries: false
cyclomatic_complexity:
  ignores_case_statements: true
identifier_name:
  # All small words used in our app and acceptable abbreviation excluded
  excluded: [x, y, i, j, to, id]
  allowed_symbols: "_"
  min_length: 0
  max_length:
    warning: 50
type_name:
  excluded: [ID]
  max_length:
    warning: 50
line_length:
  warning: 200
  error: 200
statement_position:
  statement_mode: uncuddled_else
large_tuple:
  warning: 3
type_body_length:
  warning: 300
  error: 450
number_separator:
  minimum_length: 5
  minimum_fraction_length: 7
